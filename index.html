const decodeBase64Url = (data) => {
  try { return decodeURIComponent(escape(atob(data.replace(/-/g, '+').replace(/_/g, '/')))); }
  catch { return ''; }
};
const getEmailBodyText = (payload) => {
  if (!payload) return '';
  if (payload.body?.data) return decodeBase64Url(payload.body.data);
  if (payload.parts) {
    let c = '';
    for (const p of payload.parts) {
      if (p.mimeType === 'text/plain' && p.body?.data) c += decodeBase64Url(p.body.data);
      else if (p.mimeType === 'text/html' && p.body?.data && !c) c += decodeBase64Url(p.body.data).replace(/<[^>]+>/g, ' ');
      else if (p.parts) c += getEmailBodyText(p);
    }
    return c;
  }
  return '';
};
const AMOUNT_PATTERNS = [
  { regex: /(?:₹|Rs\.?\s?|INR\s?)\s?([\d,]+(?:\.\d{1,2})?)/i, currency: 'INR' },
  { regex: /(?:\$|USD\s?)\s?([\d,]+(?:\.\d{1,2})?)/i, currency: 'USD' },
  { regex: /(?:£|GBP\s?)\s?([\d,]+(?:\.\d{1,2})?)/i, currency: 'GBP' },
  { regex: /(?:€|EUR\s?)\s?([\d,]+(?:\.\d{1,2})?)/i, currency: 'EUR' },
];
const extractAmount = (body, subject = '') => {
  const hay = `${subject}\n${body}`;
  const focused = [...hay.matchAll(/(?:total|amount|charged|paid|payment|grand total|subtotal|order total)[^\d]{0,40}/gi)]
    .map(m => hay.substring(m.index, m.index + 80));
  for (const snip of focused) {
    for (const { regex, currency } of AMOUNT_PATTERNS) {
      const m = snip.match(regex);
      if (m) {
        const v = parseFloat(m[1].replace(/,/g, ''));
        if (!isNaN(v) && v > 0 && v < 100000) return { amount: v, currency };
      }
    }
  }
  for (const { regex, currency } of AMOUNT_PATTERNS) {
    const m = hay.match(regex);
    if (m) {
      const v = parseFloat(m[1].replace(/,/g, ''));
      if (!isNaN(v) && v > 0 && v < 100000) return { amount: v, currency };
    }
  }
  return null;
};

const formatCurrency = (a, c) => {
  if (c === 'INR') return '₹' + Math.round(a).toLocaleString('en-IN');
  if (c === 'USD') return '$' + a.toFixed(2);
  if (c === 'GBP') return '£' + a.toFixed(2);
  if (c === 'EUR') return '€' + a.toFixed(2);
  return a.toFixed(2) + ' ' + c;
};

    track('email_captured', { has_gmail: !!gmailAddr });
    await submitEmail(email, gmailAddr || '');
    onSubmit(email);
  };

  return (
    <div className="bg-white rounded-2xl p-8 shadow-lg max-w-md mx-auto text-center">
      <div className="w-16 h-16 mx-auto bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-3xl mb-4">📬</div>
      <h2 className="text-2xl font-bold mb-2">Where should we send your report?</h2>
      <p className="text-gray-600 mb-6 text-sm">We'll email you a copy of your subscription audit so you can refer back to it. No spam, just your report.</p>
      <input
        type="email"
        value={email}
        onChange={e => setEmail(e.target.value)}
        placeholder="your@email.com"
        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl mb-3 focus:border-purple-500 focus:outline-none"
      />
      <button
        onClick={handle}
        disabled={!email.includes('@') || submitting}
        className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-300 disabled:to-gray-400 text-white font-semibold py-3 rounded-xl shadow"
      >
        {submitting ? 'Saving...' : 'Email me my report'}
      </button>
      <button onClick={() => { track('email_gate_skipped', {}); onSkip(); }} className="text-gray-400 text-sm mt-3 hover:text-gray-600">Skip — just show me results</button>
    </div>
  );
};

// ---------------------------------------------------------------------------
// MAIN COMPONENT
// ---------------------------------------------------------------------------
const SubscriptionScanner = () => {
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [accessToken, setAccessToken] = useState(null);
  const [userEmail, setUserEmail] = useState('');
  const [subscriptions, setSubscriptions] = useState([]);
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0, current: '' });
  const [error, setError] = useState(null);
  const [hasScanned, setHasScanned] = useState(false);
  const [showEmailGate, setShowEmailGate] = useState(false);
  const [emailSubmitted, setEmailSubmitted] = useState(false);
  const [proModalOpen, setProModalOpen] = useState(false);
  const [proModalTrigger, setProModalTrigger] = useState('');

  useEffect(() => { track('page_viewed', {}); }, []);

  const openProModal = (trigger) => {
    track('clicked_locked_feature', { feature: trigger });
    setProModalTrigger(trigger);
    setProModalOpen(true);
  };

  const handleSignIn = () => {
    track('clicked_sign_in', {});
    setError(null);
    try {
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.error) { setError(`OAuth Error: ${response.error}`); return; }
          if (response.access_token) {
            setAccessToken(response.access_token);
            setIsAuthenticated(true);
            track('signed_in_successfully', {});
            // Try to grab Gmail address for prefill
            try {
              const profileRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/profile', {
                headers: { Authorization: `Bearer ${response.access_token}` },
              });
              if (profileRes.ok) {
                const profile = await profileRes.json();
                setUserEmail(profile.emailAddress || '');
              }
            } catch (e) { /* not critical */ }
            setError(null);
          }
        },
      });
      tokenClient.requestAccessToken({ prompt: 'consent' });
    } catch (err) {
      setError(`Failed to initialize OAuth: ${err.message}`);
    }
  };

  const searchGmail = async (query) => {
    const res = await fetch(
      `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(query)}&maxResults=5`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!res.ok) throw new Error(`Gmail API error: ${res.status}`);
    const data = await res.json();
    return data.messages || [];
  };

  const getMessage = async (id) => {
    const res = await fetch(
      `https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!res.ok) throw new Error(`Failed to fetch message: ${res.status}`);
    return res.json();
  };

  const extractDate = (m) => {
    const h = (m.payload?.headers || []).find(x => x.name.toLowerCase() === 'date');
    return h ? new Date(h.value) : new Date(parseInt(m.internalDate));
  };
  const extractSubject = (m) => {
    const h = (m.payload?.headers || []).find(x => x.name.toLowerCase() === 'subject');
    return h?.value || '';
  };

  const scanSubscriptions = async () => {
    track('clicked_start_scan', {});
    setLoading(true);
    setError(null);
    setSubscriptions([]);
    setProgress({ done: 0, total: SERVICES.length, current: '' });

    const results = [];
    for (let i = 0; i < SERVICES.length; i++) {
      const service = SERVICES[i];
      setProgress({ done: i, total: SERVICES.length, current: service.name });
      let msgs = [];
      for (const query of service.queries) {
        try {
          const ids = await searchGmail(query);
          for (const m of ids) if (!msgs.find(x => x.id === m.id)) msgs.push(m);
          if (msgs.length >= 3) break;
        } catch (err) { console.error(`Search failed for ${service.name}:`, err); }
      }
      if (msgs.length === 0) continue;

      const fetched = [];
      for (const m of msgs.slice(0, 3)) {
        try { fetched.push(await getMessage(m.id)); }
        catch (err) { console.error(`Fetch failed:`, err); }
      }
      if (fetched.length === 0) continue;

      const parsed = fetched.map(msg => {
        const body = getEmailBodyText(msg.payload);
        const subject = extractSubject(msg);
        const amt = extractAmount(body, subject);
        return { date: extractDate(msg), amount: amt?.amount ?? null, currency: amt?.currency ?? null };
      }).sort((a, b) => b.date - a.date);

      const latest = parsed[0];
      const previous = parsed.find((p, idx) => idx > 0 && p.amount != null) || null;
      const finalAmount = latest.amount ?? service.fallback.amount;
      const finalCurrency = latest.currency ?? service.fallback.currency;
      const amountIsEstimate = latest.amount == null;

      let priceHike = null;
      if (previous && previous.amount != null && latest.amount != null
          && previous.currency === latest.currency
          && latest.amount > previous.amount * 1.05) {
        priceHike = {
          from: previous.amount, to: latest.amount, currency: latest.currency,
          pct: Math.round((latest.amount / previous.amount - 1) * 100),
        };
      }

      results.push({
        service: service.name, category: service.category, icon: service.icon,
        lastBilled: latest.date, amount: finalAmount, currency: finalCurrency,
        amountIsEstimate, priceHike, status: 'Active',
      });
    }

    results.sort((a, b) => b.lastBilled - a.lastBilled);
    setSubscriptions(results);
    setLoading(false);
    setHasScanned(true);
    setProgress({ done: SERVICES.length, total: SERVICES.length, current: '' });

    track('scan_completed', { found: results.length, with_price_hike: results.filter(r => r.priceHike).length });

    // After scan completes, gate result viewing on email capture
    if (results.length > 0 && !emailSubmitted) setShowEmailGate(true);

    if (results.length === 0) {
      setError('No subscriptions found. Make sure you signed in with the account that gets billing emails.');
    }
  };

  const stats = useMemo(() => {
    if (subscriptions.length === 0) return null;
    const byCurrency = {};
    for (const s of subscriptions) byCurrency[s.currency] = (byCurrency[s.currency] || 0) + s.amount;
    const totalINR = Object.entries(byCurrency).reduce((a, [c, v]) => a + v * (FX_TO_INR[c] || 0), 0);
    const totalUSD = Object.entries(byCurrency).reduce((a, [c, v]) => a + v * (FX_TO_USD[c] || 0), 0);
    const byCategory = {};
    for (const s of subscriptions) (byCategory[s.category] = byCategory[s.category] || []).push(s);
    const duplicates = [];
    for (const [cat, list] of Object.entries(byCategory)) {
      if (['music', 'streaming', 'streaming_in', 'food'].includes(cat) && list.length > 1) {
        duplicates.push({ category: cat, services: list.map(s => s.service) });
      }
    }
    return {
      totalINR, totalUSD, annualINR: totalINR * 12, annualUSD: totalUSD * 12,
      byCurrency, byCategory, duplicates,
      priceHikes: subscriptions.filter(s => s.priceHike),
      count: subscriptions.length,
    };
  }, [subscriptions]);

  const formatDate = (d) => d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  const getDaysAgo = (d) => {
    const days = Math.floor((new Date() - d) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 30) return `${days} days ago`;
    if (days < 365) return `${Math.floor(days / 30)} months ago`;
    return `${Math.floor(days / 365)}y ago`;
  };

  // Split visible (free) and locked (Pro) subscriptions
  const visibleSubs = subscriptions.slice(0, FREE_TIER_LIMIT);
  const lockedSubs = subscriptions.slice(FREE_TIER_LIMIT);

  return (
    <div className="min-h-screen gradient-bg py-12 px-4 sm:px-6 lg:px-8">
      <ProModal
        open={proModalOpen}
        onClose={() => setProModalOpen(false)}
        trigger={proModalTrigger}
        onJoinWaitlist={(e) => { setUserEmail(e); setEmailSubmitted(true); }}
      />

      <div className="max-w-5xl mx-auto">
        <div className="text-center mb-12">
          <h1 className="text-5xl md:text-6xl font-extrabold text-white mb-4 leading-tight">
            Find every subscription<br/>draining your bank account
          </h1>
          <p className="text-xl text-white/90 max-w-2xl mx-auto">
            Scans your Gmail in seconds for Netflix, Spotify, Hotstar, Swiggy One, Cred and 70+ more services.
          </p>
        </div>

        <div className="glass-effect rounded-3xl shadow-2xl p-8 md:p-12">
          {!isAuthenticated ? (
            <div className="text-center">
              <div className="mb-8">
                <div className="w-32 h-32 mx-auto bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-6xl mb-6 shadow-xl">📧</div>
                <h2 className="text-3xl font-bold text-gray-800 mb-3">Connect your Gmail</h2>
                <p className="text-gray-600 text-lg mb-8 max-w-md mx-auto">We scan only billing-related emails. Nothing leaves your browser — no servers, no storage.</p>
              </div>
              {error && <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-left max-w-md mx-auto"><p className="text-red-800 text-sm">{error}</p></div>}
              <button onClick={handleSignIn} className="inline-flex items-center justify-center gap-3 bg-white text-gray-800 font-semibold py-4 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all border-2 border-gray-200 hover:border-gray-300 text-lg">
                <svg className="w-6 h-6" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
              </button>
              <div className="mt-6">
                <a href="/calculator" className="text-purple-600 hover:text-purple-800 font-semibold underline underline-offset-4">See how much your forgotten subscriptions cost you</a>
              </div>
              <div className="mt-8 flex flex-wrap items-center justify-center gap-6 text-sm text-gray-500">
                <div className="flex items-center gap-2">
                  <svg className="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001z" clipRule="evenodd"/></svg>
                  Read-only access
                </div>
                <div className="flex items-center gap-2">
                  <svg className="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2z" clipRule="evenodd"/></svg>
                  Runs in your browser
                </div>
                <div className="flex items-center gap-2">
                  <svg className="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/></svg>
                  70+ services detected
                </div>
              </div>
            </div>
          ) : (
            <div>
              <div className="flex flex-wrap items-center justify-between gap-4 mb-8">
                <div>
                  <h2 className="text-3xl font-bold text-gray-800">Your subscriptions</h2>
                  <p className="text-gray-600 mt-1">Scanning {SERVICES.length} services from your Gmail</p>
                </div>
                <button onClick={scanSubscriptions} disabled={loading} className="inline-flex items-center gap-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-400 disabled:to-gray-400 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all">
                  {loading ? (<><svg className="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>Scanning…</>) :
                    (<><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>{hasScanned ? 'Re-scan' : 'Start scan'}</>)}
                </button>
              </div>

              {loading && (
                <div className="mb-6">
                  <div className="flex justify-between text-sm text-gray-600 mb-2">
                    <span>Checking {progress.current || '…'}</span>
                    <span>{progress.done} / {progress.total}</span>
                  </div>
                  <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-200" style={{ width: `${(progress.done / Math.max(1, progress.total)) * 100}%` }}/>
                  </div>
                </div>
              )}

              {error && <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl"><p className="text-red-800">{error}</p></div>}

              {loading && subscriptions.length === 0 && (
                <div className="space-y-4">
                  {[1, 2, 3, 4].map(i => <div key={i} className="shimmer h-20 rounded-xl"></div>)}
                </div>
              )}

              {/* Email gate — shown immediately after scan completes */}
              {!loading && showEmailGate && !emailSubmitted && subscriptions.length > 0 && (
                <EmailGate
                  gmailAddr={userEmail}
                  onSubmit={(e) => { setUserEmail(e); setEmailSubmitted(true); setShowEmailGate(false); }}
                  onSkip={() => { setShowEmailGate(false); }}
                />
              )}

              {!loading && stats && !showEmailGate && (
                <>
                  {/* Hero number */}
                  <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 mb-6 text-center text-white shadow-xl">
                    <p className="text-sm uppercase tracking-wider text-gray-400 mb-2">You are spending</p>
                    <div className="text-5xl md:text-7xl font-extrabold big-number mb-2">
                      {stats.byCurrency.INR && stats.byCurrency.USD
                        ? <>{formatCurrency(stats.byCurrency.INR, 'INR')} <span className="text-3xl text-gray-400">+</span> {formatCurrency(stats.byCurrency.USD, 'USD')}</>
                        : stats.byCurrency.INR
                          ? formatCurrency(stats.byCurrency.INR, 'INR')
                          : formatCurrency(stats.byCurrency.USD || stats.totalUSD, 'USD')}
                    </div>
                    <p className="text-gray-400 mb-4">per month, across {stats.count} active subscription{stats.count !== 1 ? 's' : ''}</p>
                    <div className="inline-flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full text-sm">
                      <span>📅 That's <strong>{formatCurrency(stats.annualINR, 'INR')}</strong> per year</span>
                    </div>
                  </div>

                  {/* Price hikes */}
                  {stats.priceHikes.length > 0 && (
                    <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-5 mb-6">
                      <h3 className="font-bold text-red-900 mb-3 flex items-center gap-2"><span>⚠️</span> Price increases detected</h3>
                      <ul className="space-y-1 text-sm text-red-800">
                        {stats.priceHikes.map((s, i) => (
                          <li key={i}><strong>{s.service}</strong>: {formatCurrency(s.priceHike.from, s.priceHike.currency)} → {formatCurrency(s.priceHike.to, s.priceHike.currency)} (+{s.priceHike.pct}%)</li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Duplicates */}
                  {stats.duplicates.length > 0 && (
                    <div className="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-5 mb-6">
                      <h3 className="font-bold text-yellow-900 mb-3 flex items-center gap-2"><span>🔁</span> Possible duplicates</h3>
                      <ul className="space-y-1 text-sm text-yellow-800">
                        {stats.duplicates.map((d, i) => (
                          <li key={i}>You have multiple <strong>{CATEGORY_LABELS[d.category]}</strong> services: {d.services.join(', ')}.</li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Count header */}
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl font-bold text-gray-800">{stats.count}</span>
                      <span className="text-gray-600">Active subscription{stats.count !== 1 ? 's' : ''}</span>
                    </div>
                    {lockedSubs.length > 0 && (
                      <span className="text-sm text-amber-700 font-medium bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                        🔒 {lockedSubs.length} more locked
                      </span>
                    )}
                  </div>

                  {/* Free subs */}
                  <div className="grid gap-3 mb-3">
                    {visibleSubs.map((sub, index) => (
                      <div key={index} className="service-badge bg-white border-2 border-gray-100 rounded-xl p-5 hover:border-purple-200 transition-all">
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                          <div className="flex items-center gap-4 min-w-0">
                            <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${CATEGORY_COLORS[sub.category] || 'from-gray-500 to-gray-600'} flex items-center justify-center text-2xl shadow-md shrink-0`}>{sub.icon}</div>
                            <div className="min-w-0">
                              <h3 className="text-lg font-bold text-gray-800 truncate">{sub.service}</h3>
                              <p className="text-gray-500 text-sm">Last billed {getDaysAgo(sub.lastBilled)} · {formatDate(sub.lastBilled)}</p>
                            </div>
                          </div>
                          <div className="text-right">
                            <div className="text-xl font-bold text-gray-900">
                              {formatCurrency(sub.amount, sub.currency)}
                              {sub.amountIsEstimate && <span className="text-xs text-gray-400 font-normal ml-1">est.</span>}
                            </div>
                            <div className="inline-flex items-center gap-2 px-2 py-0.5 mt-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">
                              <span className="w-1.5 h-1.5 bg-green-500 rounded-full"></span>{sub.status}
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Locked subs — blurred, click to upgrade */}
                  {lockedSubs.length > 0 && (
                    <div className="relative">
                      <div className="grid gap-3 locked-blur">
                        {lockedSubs.slice(0, 3).map((sub, index) => (
                          <div key={index} className="bg-white border-2 border-gray-100 rounded-xl p-5">
                            <div className="flex items-center justify-between gap-4 flex-wrap">
                              <div className="flex items-center gap-4 min-w-0">
                                <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${CATEGORY_COLORS[sub.category]} flex items-center justify-center text-2xl shrink-0`}>{sub.icon}</div>
                                <div className="min-w-0">
                                  <h3 className="text-lg font-bold text-gray-800 truncate">{sub.service}</h3>
                                  <p className="text-gray-500 text-sm">Last billed {getDaysAgo(sub.lastBilled)}</p>
                                </div>
                              </div>
                              <div className="text-xl font-bold text-gray-900">{formatCurrency(sub.amount, sub.currency)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                      <div className="absolute inset-0 flex items-center justify-center">
                        <button onClick={() => openProModal('see_all_subs')} className="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl pro-glow flex items-center gap-3">
                          <span>🔒</span>
                          See {lockedSubs.length} more with Pro
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Locked features grid */}
                  <div className="mt-8 grid md:grid-cols-2 gap-4">
                    <button onClick={() => openProModal('monthly_rescan')} className="text-left bg-white border-2 border-gray-200 hover:border-amber-400 rounded-xl p-5 transition-all group">
                      <div className="flex items-start gap-3">
                        <span className="text-2xl">🔄</span>
                        <div className="flex-1">
                          <div className="flex items-center gap-2 mb-1">
                            <h4 className="font-bold text-gray-900">Monthly auto-rescan</h4>
                            <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-semibold">PRO</span>
                          </div>
                          <p className="text-sm text-gray-600">Catch new charges the moment they happen.</p>
                        </div>
                      </div>
                    </button>
                    <button onClick={() => openProModal('cancellation_emails')} className="text-left bg-white border-2 border-gray-200 hover:border-amber-400 rounded-xl p-5 transition-all group">
                      <div className="flex items-start gap-3">
                        <span className="text-2xl">✉️</span>
                        <div className="flex-1">
                          <div className="flex items-center gap-2 mb-1">
                            <h4 className="font-bold text-gray-900">Cancellation emails</h4>
                            <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-semibold">PRO</span>
