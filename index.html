            const getServiceColor = (serviceName) => {

                        scope: SCOPES,
                        callback: (response) => {

                                return;
                            }
                            if (response.access_token) {

                                setIsAuthenticated(true);

                            }

                } catch (err) {
                    setError(`Failed to initialize OAuth: ${err.message}`);
                }
            };

                const response = await fetch(

                );

                const data = await response.json();
                return data.messages || [];
            };

                const response = await fetch(
                    `https://gmail.googleapis.com/gmail/v1/users/me/messages/${messageId}`,

                );
                if (!response.ok) throw new Error(`Failed to fetch message: ${response.status}`);
                return await response.json();
            };

                const headers = message.payload?.headers || [];
                const dateHeader = headers.find(h => h.name.toLowerCase() === 'date');

                return new Date(parseInt(message.internalDate));
            };

                                if (messages.length > 0) {
                                    found = true;
                                    const messageDetails = await getMessageDetails(messages[0].id);
                                    const messageDate = extractDate(messageDetails);

                                    }

                            } catch (err) {

                        }

                        if (found) {
                            results.push({
                                service: service.name,
                                lastBilled: latestDate,
                                status: 'Active'
                            });
                        }

                    results.sort((a, b) => b.lastBilled - a.lastBilled);
                    setSubscriptions(results);

                    if (results.length === 0) {
                        setError('No subscriptions found in your Gmail.');

                    setError(`Error scanning emails: ${err.message}`);

            const formatDate = (date) => {

                if (days === 1) return 'Yesterday';
                return `${days} days ago`;

                                    <div className="flex items-center justify-between mb-8">
                                        <div>
                                            <h2 className="text-3xl font-bold text-gray-800">Your Subscriptions</h2>
                                            <p className="text-gray-600 mt-1">Scan your Gmail to find active subscriptions</p>
                                        </div>
                                        <button
                                            onClick={scanSubscriptions}
                                            disabled={loading}
                                            className="inline-flex items-center gap-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-400 disabled:to-gray-400 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200"
                                        >
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                                                    </svg>
                                                    Scanning...
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                                    </svg>
                                                    Start Scan
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    {error && (
                                        <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl">
                                            <p className="text-red-800">{error}</p>
                                        </div>
                                    )}

                                    {loading && (
                                        <div className="space-y-4">
                                            {[1,2,3,4,5].map(i => (
                                                <div key={i} className="shimmer h-20 rounded-xl"></div>
                                            ))}
                                        </div>
                                    )}

                                    {!loading && subscriptions.length > 0 && (
                                        <div>
                                            <div className="flex items-center justify-between mb-6">
                                                <div className="flex items-center gap-3">
                                                    <span className="text-2xl font-bold text-gray-800">{subscriptions.length}</span>
                                                    <span className="text-gray-600">Active Subscription{subscriptions.length !== 1 ? 's' : ''}</span>
                                                </div>
                                                <button
                                                    onClick={() => setShowJson(!showJson)}
                                                    className="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium text-gray-700 transition-colors"
                                                >
                                                    {showJson ? '📊 Show Cards' : '{ } Show JSON'}
                                                </button>
                                            </div>

                                            {showJson ? (
                                                <div className="bg-gray-900 text-green-400 p-6 rounded-xl overflow-x-auto">
                                                    <pre className="text-sm font-mono">{jsonOutput}</pre>
                                                </div>
                                            ) : (
                                                <div className="grid gap-4">
                                                    {subscriptions.map((sub, index) => (
                                                        <div 
                                                            key={index}
                                                            className="service-badge bg-white border-2 border-gray-100 rounded-xl p-6 hover:border-purple-200 transition-all"
                                                        >
                                                            <div className="flex items-center justify-between">
                                                                <div className="flex items-center gap-4">
                                                                    <div className={`w-16 h-16 rounded-2xl bg-gradient-to-br ${serviceColors[sub.service] || 'from-gray-500 to-gray-600'} flex items-center justify-center text-3xl shadow-lg`}>
                                                                        {serviceIcons[sub.service] || '📱'}
                                                                    </div>
                                                                    <div>
                                                                        <h3 className="text-xl font-bold text-gray-800">{sub.service}</h3>
                                                                        <p className="text-gray-500 text-sm mt-1">
                                                                            Last billed {getDaysAgo(sub.lastBilled)}
                                                                        </p>
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold">
                                                                        <span className="w-2 h-2 bg-green-500 rounded-full"></span>
                                                                        {sub.status}
                                                                    </div>
                                                                    <p className="text-gray-600 text-sm mt-2">{formatDate(sub.lastBilled)}</p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="mt-8 text-center">
                            <p className="text-white/80 text-sm mb-3">🔒 Your data never leaves your browser • 100% secure & private</p>
                            <div className="flex items-center justify-center gap-6 text-sm mb-3">
                                <a href="/privacy.html" className="text-white/70 hover:text-white transition-colors">Privacy Policy</a>
                                <span className="text-white/40">•</span>
                                <a href="/terms.html" className="text-white/70 hover:text-white transition-colors">Terms of Service</a>
                            </div>
                            <p className="text-white/60 text-xs">© 2026 Aagam Technologies. All rights reserved.</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<SubscriptionScanner />, document.getElementById('root'));
    </script>
</body>
</html>
