<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Scanner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Gmail API configuration
        const CLIENT_ID = '628165838054-pqhdpcokmgdonjjvom2pmqsthlsso3vv.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/gmail.readonly';

        const SubscriptionScanner = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [accessToken, setAccessToken] = useState(null);
            const [subscriptions, setSubscriptions] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [showJson, setShowJson] = useState(false);
            const [currentUrl, setCurrentUrl] = useState('');

            useEffect(() => {
                setCurrentUrl(window.location.href);
            }, []);

            const handleSignIn = () => {
                setError(null);
                
                try {
                    const tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: CLIENT_ID,
                        scope: SCOPES,
                        callback: (response) => {
                            if (response.error) {
                                setError(`OAuth Error: ${response.error} - ${response.error_description || ''}`);
                                return;
                            }
                            if (response.access_token) {
                                setAccessToken(response.access_token);
                                setIsAuthenticated(true);
                                setError(null);
                            }
                        },
                        error_callback: (error) => {
                            setError(`Authentication failed: ${JSON.stringify(error)}`);
                        }
                    });
                    tokenClient.requestAccessToken({ prompt: 'consent' });
                } catch (err) {
                    setError(`Failed to initialize OAuth: ${err.message}`);
                }
            };

            const searchGmail = async (query) => {
                const response = await fetch(
                    `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(query)}&maxResults=20`,
                    {
                        headers: {
                            Authorization: `Bearer ${accessToken}`,
                        },
                    }
                );

                if (!response.ok) {
                    throw new Error(`Gmail API error: ${response.status}`);
                }

                const data = await response.json();
                return data.messages || [];
            };

            const getMessageDetails = async (messageId) => {
                const response = await fetch(
                    `https://gmail.googleapis.com/gmail/v1/users/me/messages/${messageId}`,
                    {
                        headers: {
                            Authorization: `Bearer ${accessToken}`,
                        },
                    }
                );

                if (!response.ok) {
                    throw new Error(`Failed to fetch message: ${response.status}`);
                }

                return await response.json();
            };

            const extractDate = (message) => {
                const headers = message.payload?.headers || [];
                const dateHeader = headers.find(h => h.name.toLowerCase() === 'date');
                if (dateHeader) {
                    return new Date(dateHeader.value);
                }
                return new Date(parseInt(message.internalDate));
            };

            const scanSubscriptions = async () => {
                setLoading(true);
                setError(null);
                setSubscriptions([]);

                const services = [
                    { name: 'Netflix', queries: ['from:info@account.netflix.com receipt', 'from:netflix.com payment'] },
                    { name: 'Spotify', queries: ['from:spotify.com receipt', 'from:spotify.com payment confirmation'] },
                    { name: 'Amazon Prime', queries: ['from:amazon.com "Prime membership" charged', 'from:amazon.com "Prime Video" payment'] },
                    { name: 'Anthropic', queries: ['from:anthropic.com payment', 'from:anthropic.com invoice'] },
                    { name: 'ChatGPT', queries: ['from:openai.com receipt', 'from:openai.com "ChatGPT Plus"'] },
                ];

                try {
                    const results = [];

                    for (const service of services) {
                        let latestDate = null;
                        let found = false;

                        for (const query of service.queries) {
                            try {
                                const messages = await searchGmail(query);
                                
                                if (messages.length > 0) {
                                    found = true;
                                    const messageDetails = await getMessageDetails(messages[0].id);
                                    const messageDate = extractDate(messageDetails);
                                    
                                    if (!latestDate || messageDate > latestDate) {
                                        latestDate = messageDate;
                                    }
                                }
                            } catch (err) {
                                console.error(`Error searching ${service.name}:`, err);
                            }
                        }

                        if (found) {
                            results.push({
                                service: service.name,
                                lastBilled: latestDate,
                                status: 'Active'
                            });
                        }
                    }

                    results.sort((a, b) => b.lastBilled - a.lastBilled);
                    setSubscriptions(results);

                    if (results.length === 0) {
                        setError('No subscriptions found. Make sure you have receipts from these services in your Gmail.');
                    }
                } catch (err) {
                    setError(`Error scanning emails: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const formatDate = (date) => {
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            };

            const jsonOutput = JSON.stringify(subscriptions.map(sub => ({
                service: sub.service,
                lastBilled: sub.lastBilled.toISOString(),
                status: sub.status
            })), null, 2);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-lg shadow-xl p-8">
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">
                                📧 Subscription Scanner
                            </h1>
                            <p className="text-gray-600 mb-8">
                                Connect your Gmail to find all your active subscriptions
                            </p>

                            {!isAuthenticated ? (
                                <div className="py-6">
                                    <div className="mb-6 p-4 bg-blue-50 border-l-4 border-blue-500 rounded">
                                        <p className="font-semibold text-blue-900 mb-2">📍 Current URL:</p>
                                        <code className="text-sm bg-white px-2 py-1 rounded block mb-3 break-all">{currentUrl}</code>
                                        <p className="text-sm text-blue-800">
                                            Make sure this URL is added to your OAuth "Authorized JavaScript origins" in Google Cloud Console.
                                        </p>
                                    </div>

                                    <div className="text-center mb-6">
                                        <div className="mb-6">
                                            <svg className="w-24 h-24 mx-auto text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                            </svg>
                                        </div>
                                        
                                        {error && (
                                            <div className="mb-6 p-4 bg-red-50 border-l-4 border-red-400 text-left">
                                                <p className="font-semibold text-red-800 mb-2">❌ Error:</p>
                                                <p className="text-sm text-red-700">{error}</p>
                                                <div className="mt-4 p-3 bg-white rounded border border-red-200">
                                                    <p className="font-semibold text-sm text-gray-800 mb-2">To fix this:</p>
                                                    <ol className="text-xs text-gray-700 space-y-1 ml-4 list-decimal">
                                                        <li>Go to <a href="https://console.cloud.google.com/apis/credentials" className="text-blue-600 underline" target="_blank">Google Cloud Console</a></li>
                                                        <li>Find your OAuth client: "628165838054-pqhdpcokmgdonjjvom2pmqsthlsso3vv"</li>
                                                        <li>Click Edit (pencil icon)</li>
                                                        <li>Under "Authorized JavaScript origins", add the URL shown above</li>
                                                        <li>Click Save and wait 2-3 minutes</li>
                                                        <li>Refresh this page and try again</li>
                                                    </ol>
                                                </div>
                                            </div>
                                        )}

                                        <button
                                            onClick={handleSignIn}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200 mb-4"
                                        >
                                            Sign in with Google
                                        </button>
                                        
                                        <p className="text-sm text-gray-500">
                                            🔒 Read-only access • We only scan for subscription receipts
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <div className="mb-6">
                                        <button
                                            onClick={scanSubscriptions}
                                            disabled={loading}
                                            className="bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-200"
                                        >
                                            {loading ? 'Scanning...' : '🔍 Scan for Subscriptions'}
                                        </button>
                                    </div>

                                    {error && (
                                        <div className="mb-6 p-4 bg-red-50 border-l-4 border-red-400 text-red-700">
                                            {error}
                                        </div>
                                    )}

                                    {loading && (
                                        <div className="text-center py-8">
                                            <div className="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                                            <p className="mt-4 text-gray-600">Scanning your emails...</p>
                                        </div>
                                    )}

                                    {subscriptions.length > 0 && (
                                        <div>
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-2xl font-bold text-gray-800">
                                                    Found {subscriptions.length} Subscription{subscriptions.length !== 1 ? 's' : ''}
                                                </h2>
                                                <button
                                                    onClick={() => setShowJson(!showJson)}
                                                    className="text-sm bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded"
                                                >
                                                    {showJson ? '📊 Show Table' : '{ } Show JSON'}
                                                </button>
                                            </div>

                                            {showJson ? (
                                                <div className="bg-gray-900 text-green-400 p-4 rounded-lg overflow-x-auto">
                                                    <pre className="text-sm">{jsonOutput}</pre>
                                                </div>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="min-w-full bg-white border border-gray-200 rounded-lg">
                                                        <thead className="bg-gray-50">
                                                            <tr>
                                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                                    Service
                                                                </th>
                                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                                    Last Billed
                                                                </th>
                                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                                    Status
                                                                </th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-gray-200">
                                                            {subscriptions.map((sub, index) => (
                                                                <tr key={index} className="hover:bg-gray-50">
                                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                                        <div className="text-sm font-medium text-gray-900">
                                                                            {sub.service}
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                                        <div className="text-sm text-gray-500">
                                                                            {formatDate(sub.lastBilled)}
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                                        <span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                                                            {sub.status}
                                                                        </span>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="mt-6 text-center text-sm text-gray-600">
                            <p>🔒 Your data never leaves your browser • Read-only Gmail access</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<SubscriptionScanner />, document.getElementById('root'));
    </script>
</body>
</html>
